# PL/SQL ⇔ PL/pgSQL 二刀流検証テスト基盤の実行環境
#   oracle   : Oracle Database 23ai Free (AL32UTF8 / UTC)
#   postgres : PostgreSQL 16 + plpgsql_check (UTF8 / UTC)
#   runner   : pytest ランナー (python-oracledb Thin / psycopg 3)
name: ora-pg-test

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oracle_sys_pw}
      APP_USER: ${ORACLE_USER:-app}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-app_pw}
      TZ: UTC
    # VKTM/LGWR の優先度設定(ORA-00800 Set Priority Failed)対策
    cap_add: [SYS_NICE]
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pw}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  runner:
    build: ./docker/runner
    working_dir: /work
    volumes:
      - .:/work
    environment:
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${ORACLE_USER:-app}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-app_pw}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pw}
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      oracle:
        condition: service_healthy
      postgres:
        condition: service_healthy
